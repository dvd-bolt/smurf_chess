<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♟️ Chess Sensei — Интерактивный Тестовый Стенд</title>
  <link rel="stylesheet" href="../content/styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 4px;
    }

    .layout {
      display: flex;
      gap: 30px;
      max-width: 960px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Доска и контейнер часов */
    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 480px;
      background: #1e293b;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .player-name {
      font-weight: 600;
      font-size: 13px;
      color: #cbd5e1;
    }
    .clock-component {
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .clock-component.clock-player-turn {
      background: rgba(0, 245, 155, 0.15);
      border-color: #00f59b;
      color: #00f59b;
    }

    /* Шахматная доска */
    #test-board {
      width: 480px;
      height: 480px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 3px solid #334155;
      border-radius: 6px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      user-select: none;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .square.light { background: #e2d6b5; }
    .square.dark { background: #b88b4a; }
    .square.selected { background: #f6e05e !important; }
    .square.last-move { background: rgba(255, 255, 0, 0.35); }

    /* Фигуры */
    .piece {
      width: 85%;
      height: 85%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      line-height: 1;
      pointer-events: none;
      transition: transform 0.1s;
    }
    .piece.white-piece {
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6), 0 0 2px #000;
    }
    .piece.black-piece {
      color: #1e1e1e;
      text-shadow: 0 1px 2px rgba(255,255,255,0.3);
    }

    /* Панель управления */
    .control-panel {
      width: 320px;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }
    button.btn {
      flex: 1;
      background: #334155;
      border: 1px solid rgba(255,255,255,0.1);
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }
    button.btn:hover { background: #475569; }
    button.btn-accent {
      background: #0ea5e9;
      border-color: #38bdf8;
      color: #04101e;
      font-weight: 700;
    }
    button.btn-accent:hover { background: #38bdf8; }

    .fen-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .fen-box label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    .fen-input {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
    }

    .moves-list {
      background: #0f172a;
      border-radius: 6px;
      padding: 8px;
      height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .presets-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }
    .preset-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1><span>👑</span> Chess Sensei — Тестовый стенд</h1>
    <p class="subtitle">Интерактивная доска для проверки работы расширения, таймингов и стрелок</p>
  </header>

  <div class="layout">
    <div class="board-container">
      <!-- Верхний игрок (Черные) -->
      <div class="player-bar top">
        <span class="player-name">Соперник (Черные)</span>
        <div class="clock-component" id="clock-black">
          <span class="clock-time">3:00</span>
        </div>
      </div>

      <!-- Сама шахматная доска с классами для расширения -->
      <div id="test-board" class="board" data-board="chess"></div>

      <!-- Нижний игрок (Белые) -->
      <div class="player-bar bottom">
        <span class="player-name">Вы (Белые)</span>
        <div class="clock-component clock-player-turn" id="clock-white">
          <span class="clock-time">3:00</span>
        </div>
      </div>
    </div>

    <!-- Панель инструментов стенда -->
    <div class="control-panel">
      <div class="panel-title">Управление стендом</div>

      <div class="btn-row">
        <button class="btn btn-accent" id="btn-new">Новая игра</button>
        <button class="btn" id="btn-flip">Повернуть</button>
      </div>

      <div class="btn-row">
        <button class="btn" id="btn-t-1m">1 мин (Bullet)</button>
        <button class="btn" id="btn-t-3m">3 мин (Blitz)</button>
        <button class="btn" id="btn-t-10m">10 мин (Rapid)</button>
      </div>

      <div class="fen-box">
        <label>Текущий FEN:</label>
        <input type="text" class="fen-input" id="fen-input" readonly>
        <button class="btn" id="btn-copy-fen" style="font-size: 11px; padding: 4px;">Скопировать FEN</button>
      </div>

      <div class="fen-box">
        <label>История ходов:</label>
        <div class="moves-list" id="moves-history">1. —</div>
      </div>

      <div class="presets-row">
        <label style="font-size: 11px; color: #94a3b8; font-weight: 600;">Тестовые позиции:</label>
        <button class="preset-btn" data-fen="rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2">1. Открытый дебют (1.e4 e5)</button>
        <button class="preset-btn" data-fen="r1bqk2r/pp2bppp/2n1pn2/2pp4/2PP4/2N1PN2/PP2BPPP/R1BQ1RK1 w kq - 0 8">2. Позиция со сноуболом (+0.7)</button>
        <button class="preset-btn" data-fen="r1bqk2r/pppp1ppp/2n5/4p3/1bB1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 2 5">3. Ловушка / тактический удар</button>
      </div>
    </div>
  </div>

  <script src="../vendor/chess.js"></script>
  <script src="test_board.js"></script>

  <!-- Подключение модулей Chess Sensei для автономного тестирования в браузере -->
  <script src="../engine/position_state.js"></script>
  <script src="../engine/uci_engine.js"></script>
  <script src="../engine/browser_engine.js"></script>
  <script src="../engine/openings_data.js"></script>
  <script src="../engine/openings_book.js"></script>
  <script src="../engine/personas.js"></script>
  <script src="../engine/move_selector.js"></script>
  <script src="../engine/play_settings.js"></script>
  <script src="../engine/player_profile.js"></script>
  <script src="../engine/rated_profile.js"></script>
  <script src="../engine/position_complexity.js"></script>
  <script src="../engine/plan_tracker.js"></script>
  <script src="../engine/human_candidates.js"></script>
  <script src="../engine/human_perception.js"></script>
  <script src="../engine/legacy_plan_tracker.js"></script>
  <script src="../engine/human_legacy_selector.js"></script>
  <script src="../engine/human_selector.js"></script>
  <script src="../engine/strength_adapter.js"></script>
  <script src="../engine/game_session.js"></script>
  <script src="../engine/engine_controller.js"></script>
  <script src="../content/time_manager.js"></script>
  <script src="../content/board_detector.js"></script>
  <script src="../content/game_context.js"></script>
  <script src="../content/visual_overlay.js"></script>
  <script src="../content/hud_widget.js"></script>
  <script src="../content/move_executor.js"></script>
  <script src="../content/content.js"></script>
</body>
</html>
